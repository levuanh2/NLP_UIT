application:
  name_env: APP_NAME
  environment_env: APP_ENV
  debug_env: APP_DEBUG
  log_level_env: LOG_LEVEL

paths:
  project_root_env: PROJECT_ROOT
  data_dir_env: DATA_DIR
  corpus_data_dir_env: CORPUS_DATA_DIR
  question_data_dir_env: QUESTION_DATA_DIR
  output_dir_env: OUTPUT_DIR
  cache_data_dir_env: CACHE_DATA_DIR
  model_dir_env: MODEL_DIR

ingestion:
  document_batch_size: 1
  chunk_batch_size: 1000
  resume_enabled: true
  checksum_algorithm: sha256
  chunking_version: v2
  continue_on_document_error: true
  max_document_words_warning: 100000

embedding:
  batch_size: 64
  normalize: true

storage:
  sqlite_batch_size: 1000

index:
  root_dir: storage/indexes
  type: auto
  publish_atomically: true
