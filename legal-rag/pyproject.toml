[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-rag"
version = "0.1.0"
description = "Vietnamese Legal RAG scaffold for Subtask 2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "pydantic-settings",
    "PyYAML",
    "SQLAlchemy",
    "numpy",
    "faiss-cpu",
    "sentence-transformers",
    "sentencepiece",
    "transformers",
    "torch",
    "rank-bm25",
    "typer",
    "rich",
    "python-dotenv",
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
legal-rag = "app.cli.main:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/cli/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
